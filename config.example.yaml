# This file defines model configurations across multiple providers.
# Copy this to config.yaml and fill in non-secret values.
# All api_key, password, username, and host fields must be supplied via environment variables.

llm:
  default: azure_ai_foundry.fast

  azure_openai:
    fast:
      model_name: "gpt-4o-mini"
      api_key: ""                                         # Set via AZURE_OPENAI_API_KEY
      endpoint: "https://<your-resource>.cognitiveservices.azure.com"
      api_version: "2024-12-01-preview"
      temperature: 0.1
      max_retries: 3
    smart:
      model_name: "gpt-4.1"
      api_key: ""                                         # Set via AZURE_OPENAI_API_KEY
      endpoint: "https://<your-resource>.cognitiveservices.azure.com"
      api_version: "2024-12-01-preview"
      temperature: 0.1
      max_tokens: 32768
      top_p: 1.0
      frequency_penalty: 0.0
      presence_penalty: 0.0
      timeout: 120
      max_retries: 3
    embedding:
      model_name: "text-embedding-3-small"
      api_key: ""                                         # Set via AZURE_OPENAI_API_KEY
      endpoint: "https://<your-resource>.openai.azure.com/"
      api_version: "2024-12-01-preview"
      timeout: 60
      max_retries: 3

  azure_ai_foundry:
    fast:
      model_name: "DeepSeek-V4-Flash"
      api_key: ""                                         # Set via AZURE_AI_FOUNDRY_API_KEY
      endpoint: "https://<your-resource>.services.ai.azure.com/openai/v1/"
      temperature: 0.1
      max_retries: 3
    smart:
      model_name: "Llama-3.3-70B-Instruct"
      api_key: ""                                         # Set via AZURE_AI_FOUNDRY_API_KEY
      endpoint: "https://<your-resource>.services.ai.azure.com/openai/v1/"
      temperature: 0.1
      max_tokens: 20000
      top_p: 1.0
      frequency_penalty: 0.0
      presence_penalty: 0.0
      timeout: 120
      max_retries: 3

datasources:
  default: postgresql.primary
  postgresql:
    primary:
      host: ""                                            # Set via POSTGRESQL_HOST
      port: 5432
      database: "ai_chatbot_db"
      username: ""                                        # Set via POSTGRESQL_USER
      password: ""                                        # Set via POSTGRESQL_PASSWORD
      pool_size: 5
      max_overflow: 10
      pool_timeout: 30
      pool_recycle: 3600
      connect_timeout: 10
      charset: "utf8mb4"

logging:
  level: "INFO"                                           # DEBUG, INFO, WARNING, ERROR, CRITICAL
  console_level: "INFO"
  file_level: "DEBUG"

  max_file_size: 10485760                                 # 10MB
  backup_count: 5

  loggers:
    sqlalchemy.engine: "WARNING"
    sqlalchemy.pool: "WARNING"
    ai_agentic_chatbot.datasource: "DEBUG"
